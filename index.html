<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>LapMob Budget Tracker</title>
  <link rel="stylesheet" href="style.css">

</head>

<body>
  <div class="container">
    <div class="top">
      <div>
        <h1>☁️ My Cloud Budget</h1>
        <p>Phone ↔ Cloud ↔ Laptop synchronization</p>
      </div>
      <div class="actions"><span id="status" class="status">Connecting...</span><button class="secondary"
          onclick="signIn()">Connect</button></div>
    </div>



    <div class="cards">
      <div class="card">
        <div class="label">Balance</div>
        <div id="balance" class="amount">NT$0</div>
      </div>
      <div class="card">
        <div class="label">Income</div>
        <div id="income" class="amount income">NT$0</div>
      </div>
      <div class="card">
        <div class="label">Expenses</div>
        <div id="expenses" class="amount expense">NT$0</div>
      </div>
      <div class="card">
        <div class="label">Transactions</div>
        <div id="count" class="amount">0</div>
      </div>
    </div>

    <div class="layout">
      <div class="panel">
        <h2>Add Transaction</h2>
        <form id="form">
          <label>Type</label><select id="type">
            <option value="expense">Expense</option>
            <option value="income">Income</option>
            <option value="Bank">Bank Balance</option>
          </select>
          <label>Amount (NT$)</label><input id="amount" type="number" min="0" step="1" required placeholder="e.g. 4100">
          <label>Category</label><select id="category">
            <option>Allowance</option>
            <option>Salary</option>
             <option>Deposit</option>
            <option>Rent</option>
            <option>Food</option>
            <option>Electricity</option>
            <option>Public Electricity</option>
            <option>Tuition</option>
            <option>Transportation</option>
            <option>Gasoline</option>
            <option>Phone / Internet</option>
            <option>Motorcycle</option>
            <option>Shopping</option>
            <option>Entertainment</option>
            <option>School</option>
            <option>Other</option>
          </select>
          <label>Date</label><input id="date" type="date" required>
          <label>Note</label><input id="note" maxlength="80" placeholder="Optional">
          <button type="submit">＋ Add & Sync to Cloud</button>
        </form>
        <div class="summary">
          <div class="mini"><span class="label">This month</span><b id="monthSpend">NT$0</b></div>
          <div class="mini"><span class="label">Top category</span><b id="topCategory">—</b></div>
        </div>
      </div>

      <div class="panel">
        <h2>Transactions</h2>
        <div class="filters"><select id="monthFilter" onchange="render()">
            <option value="all">All months</option>
          </select><select id="typeFilter" onchange="render()">
            <option value="all">All types</option>
            <option value="income">Income</option>
            <option value="expense">Expenses</option>
          </select></div>
        <div style="overflow:auto">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Type</th>
                <th>Category</th>
                <th>Note</th>
                <th>Amount</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div id="empty" class="empty" style="display:none">No transactions yet.</div>
      </div>
    </div>
  </div>
  <script type="module" src="app.js"></script>

</body>

</html>
